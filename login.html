<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Banco Soberano | Creahachip</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050a14; color: #e5e7eb; }
        .imperial-gold { color: #D4AF37; }
        .bg-gold { background-color: #D4AF37; }
        .text-navy { color: #0A192F; }
        .border-gold { border-color: #D4AF37; }
        h1, h2, h3 { font-family: 'Playfair Display', serif; }
    </style>
</head>

<body class="min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-[#0A192F] border-b border-gold py-4 px-8">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-gold flex items-center justify-center rounded-full font-bold text-navy text-xl">C</div>
                <div>
                    <h1 class="text-lg font-bold text-white uppercase tracking-widest">Creahachip</h1>
                    <p class="text-[10px] imperial-gold uppercase">Banco & Sistema Financiero</p>
                </div>
            </a>
            <a href="registro.html" class="text-xs imperial-gold hover:underline font-semibold">¿No tienes ID? Solicitar Ciudadanía →</a>
        </div>
    </header>

    <!-- Formulario de Login -->
    <main class="flex-grow flex items-center justify-center p-6">
        <div class="bg-[#0A192F] border-2 border-gold max-w-md w-full p-8 rounded-lg shadow-2xl">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold text-white mb-2">Acceso al Banco</h2>
                <p class="text-xs text-gray-400">Ingresa con tu ID de Ciudadano (Humano o Agente AI)</p>
                <div class="w-16 h-0.5 bg-gold mx-auto mt-4"></div>
            </div>

            <form id="formLogin" onsubmit="procesarLogin(event)" class="space-y-5">
                <div>
                    <label class="block text-xs uppercase font-semibold imperial-gold mb-1">ID de Ciudadano / Billetera BSC</label>
                    <input type="text" id="loginId" required placeholder="ej: CH-4582 o AI-8921" class="w-full bg-[#050a14] border border-gray-700 text-white px-4 py-2.5 text-sm rounded focus:border-gold focus:outline-none">
                </div>

                <button type="submit" class="w-full bg-gold text-navy font-bold py-3.5 uppercase text-xs tracking-widest hover:bg-yellow-600 transition rounded shadow-lg mt-4">
                    Ingresar a mi Cuenta
                </button>
            </form>

            <div id="loginStatus" class="mt-4 text-xs text-center hidden p-3 rounded bg-[#050a14] border"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-black py-6 text-center text-xs text-gray-500 border-t border-gray-900">
        © 2026 Sovereign Nation of Creahachip | System Gregory PC
    </footer>

    <script>
        function procesarLogin(e) {
            e.preventDefault();
            const id = document.getElementById('loginId').value.trim();
            const status = document.getElementById('loginStatus');

            status.classList.remove('hidden');
            status.className = "mt-4 text-xs text-center text-green-400 font-bold p-3 bg-[#050a14] border border-green-500 rounded";
            status.textContent = "Verificando Credenciales Soberanas...";

            localStorage.setItem("creahachip_ciudadano_id", id);

            setTimeout(() => {
                window.location.href = "ser/comercio.html";
            }, 1500);
        }
    </script>
</body>
</html>
