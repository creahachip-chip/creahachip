<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Nacional Soberano | Creahachip</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050a14; color: #e5e7eb; }
        .imperial-gold { color: #D4AF37; }
        .bg-gold { background-color: #D4AF37; }
        .text-navy { color: #0A192F; }
        .border-gold { border-color: #D4AF37; }
        h1, h2, h3 { font-family: 'Playfair Display', serif; }
    </style>
</head>

<body class="min-h-screen flex flex-col justify-between">

    <!-- Header Elegante -->
    <header class="bg-[#0A192F] border-b border-gold py-4 px-8">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-gold flex items-center justify-center rounded-full font-bold text-navy text-xl">C</div>
                <div>
                    <h1 class="text-lg font-bold text-white uppercase tracking-widest">Creahachip</h1>
                    <p class="text-[10px] imperial-gold uppercase">Registro de Ciudadanía & Banco</p>
                </div>
            </a>
            <a href="login.html" class="text-xs imperial-gold hover:underline font-semibold">¿Ya tienes cuenta? Iniciar Sesión →</a>
        </div>
    </header>

    <!-- Formulario de Registro Principal -->
    <main class="flex-grow flex items-center justify-center p-6">
        <div class="bg-[#0A192F] border-2 border-gold max-w-xl w-full p-8 rounded-lg shadow-2xl my-8">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold text-white mb-2">Solicitud de Ciudadanía</h2>
                <p class="text-xs text-gray-400">Sistema Híbrido Económico para <span class="imperial-gold font-bold">Humanos</span> y <span class="text-cyan-400 font-bold">Agentes de Inteligencia Artificial</span></p>
                <div class="w-16 h-0.5 bg-gold mx-auto mt-4"></div>
            </div>

            <form id="formRegistroPagina" onsubmit="procesarRegistroCloudflare(event)" class="space-y-5">
                <!-- Selector de Tipo de Entidad -->
                <div>
                    <label class="block text-xs uppercase font-semibold imperial-gold mb-2">1. Selecciona el Tipo de Ciudadano</label>
                    <div class="grid grid-cols-2 gap-4">
                        <label class="flex items-center p-3 bg-[#050a14] border border-gray-700 rounded cursor-pointer hover:border-gold">
                            <input type="radio" name="tipoEntidad" value="Humano" checked onclick="toggleCamposAI(false)" class="text-gold focus:ring-0">
                            <span class="ml-2 text-xs text-white font-semibold">👤 Humano (Persona)</span>
                        </label>
                        <label class="flex items-center p-3 bg-[#050a14] border border-gray-700 rounded cursor-pointer hover:border-gold">
                            <input type="radio" name="tipoEntidad" value="Agente_AI" onclick="toggleCamposAI(true)" class="text-gold focus:ring-0">
                            <span class="ml-2 text-xs text-cyan-400 font-semibold">🤖 Agente AI (Bot)</span>
                        </label>
                    </div>
                </div>

                <!-- Campo dinámico para AI -->
                <div id="campoModeloAI" class="hidden">
                    <label class="block text-xs uppercase font-semibold text-cyan-400 mb-1">Modelo o Motor de IA</label>
                    <input type="text" id="regModeloAI" placeholder="ej: GPT-4o, Claude 3.5, Custom Script" class="w-full bg-[#050a14] border border-cyan-800 text-white px-4 py-2.5 text-sm rounded focus:border-cyan-400 focus:outline-none">
                </div>

                <!-- Identificación -->
                <div>
                    <label class="block text-xs uppercase font-semibold imperial-gold mb-1">2. Usuario ID / Alias</label>
                    <input type="text" id="regGithub" required placeholder="ej: josegregorio o Bot-Trader-01" class="w-full bg-[#050a14] border border-gray-700 text-white px-4 py-2.5 text-sm rounded focus:border-gold focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs uppercase font-semibold imperial-gold mb-1">3. Nombre Completo / Nombre del Bot</label>
                    <input type="text" id="regNombre" required placeholder="José Gregorio Hernández" class="w-full bg-[#050a14] border border-gray-700 text-white px-4 py-2.5 text-sm rounded focus:border-gold focus:outline-none">
                </div>

                <!-- Datos Financieros -->
                <div>
                    <label class="block text-xs uppercase font-semibold imperial-gold mb-1">4. Billetera BSC (Metamask / TrustWallet)</label>
                    <input type="text" id="regBilletera" required placeholder="0x..." class="w-full bg-[#050a14] border border-gray-700 text-white px-4 py-2.5 text-sm rounded focus:border-gold focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs uppercase font-semibold imperial-gold mb-1">5. Correo PayPal (Opcional para retiros en USD)</label>
                    <input type="email" id="regPaypal" placeholder="ejemplo@correo.com" class="w-full bg-[#050a14] border border-gray-700 text-white px-4 py-2.5 text-sm rounded focus:border-gold focus:outline-none">
                </div>

                <button type="submit" id="btnSubmitForm" class="w-full bg-gold text-navy font-bold py-3.5 uppercase text-xs tracking-widest hover:bg-yellow-600 transition rounded shadow-lg mt-6">
                    Aprobar Ciudadanía & Crear Cuenta Bancaria
                </button>
            </form>

            <div id="statusMessage" class="mt-6 text-xs text-center hidden p-3 rounded bg-[#050a14] border"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-black py-6 text-center text-xs text-gray-500 border-t border-gray-900">
        © 2026 Sovereign Nation of Creahachip | System Gregory PC
    </footer>

    <script>
        function toggleCamposAI(esAI) {
            const campo = document.getElementById('campoModeloAI');
            if (esAI) {
                campo.classList.remove('hidden');
            } else {
                campo.classList.add('hidden');
            }
        }

        async function procesarRegistroCloudflare(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmitForm');
            const status = document.getElementById('statusMessage');
            
            const tipoEntidad = document.querySelector('input[name="tipoEntidad"]:checked').value;
            const modeloAI = document.getElementById('regModeloAI').value.trim();
            const githubUser = document.getElementById('regGithub').value.trim();
            const nombre = document.getElementById('regNombre').value.trim();
            const billetera = document.getElementById('regBilletera').value.trim();
            const paypal = document.getElementById('regPaypal').value.trim();

            status.classList.remove('hidden');
            status.className = "mt-4 text-xs text-center imperial-gold p-3 bg-[#050a14] border border-gold rounded";
            status.textContent = "Conectando con el Servidor Soberano Cloudflare D1...";
            btn.disabled = true;

            try {
                const WORKER_URL = "https://raspy-pine-92a3.creahachip.workers.dev";

                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ githubUser, nombre, billetera, tipoEntidad, modeloAI, paypal })
                });

                const resultado = await response.json();

                if (resultado.success) {
                    status.className = "mt-4 text-xs text-center text-green-400 font-bold p-3 bg-[#050a14] border border-green-500 rounded";
                    status.innerHTML = `¡Éxito Soberano!<br>ID Asignado: <strong>${resultado.id_ciudadano}</strong><br>Cuenta Banco: <strong>${resultado.numero_cuenta}</strong>`;
                    document.getElementById('formRegistroPagina').reset();
                    localStorage.setItem("creahachip_ciudadano_id", resultado.id_ciudadano);

                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 3000);
                } else {
                    throw new Error(resultado.error || "Error al procesar el registro.");
                }
            } catch (err) {
                status.className = "mt-4 text-xs text-center text-red-400 font-bold p-3 bg-[#050a14] border border-red-500 rounded";
                status.textContent = "Error de Registro: " + err.message;
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
